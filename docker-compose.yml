name: studypilot
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-studypilot}
      MYSQL_USER: ${MYSQL_USER:-studypilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-studypilot_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-studypilot}:${MYSQL_PASSWORD:-studypilot_dev_password}@mysql:3306/${MYSQL_DATABASE:-studypilot}?charset=utf8mb4
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: ./bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      WEBAPP_URL: ${WEBAPP_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-studypilot}:${MYSQL_PASSWORD:-studypilot_dev_password}@mysql:3306/${MYSQL_DATABASE:-studypilot}?charset=utf8mb4
      API_BASE_URL: http://backend:8000
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-10485760}
      AI_ADMIN_TELEGRAM_ID: ${AI_ADMIN_TELEGRAM_ID:-0}
      AI_BATCH_MAX_WAIT_SECONDS: ${AI_BATCH_MAX_WAIT_SECONDS:-90}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      ODD_WEEK_REFERENCE: ${ODD_WEEK_REFERENCE:-}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_DEV_AUTH: ${VITE_DEV_AUTH:-false}
      VITE_DEV_TELEGRAM_ID: ${VITE_DEV_TELEGRAM_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
